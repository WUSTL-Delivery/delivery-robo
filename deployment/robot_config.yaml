# Robot startup config, read by deployment/startup.sh on every boot.
# Committed defaults. To override on one Pi without touching git, copy this
# file to deployment/robot_config.local.yaml (gitignored) and edit that.

# Which stack master_launch.py brings up:
#   teleop     - wired joystick teleop (joy_node + joystick_control), no sensors
#   autonomous - sensor stack only (RTK GPS + NTRIP, IMU); nothing drives the motors
#   autonomy   - the full delivery-autonomy stack on the robot: sensors + arduino_bridge +
#                twist_mux + joystick override + EKF/planner/MPPI controller
#                (ros2_ws/src/hardware_bringup, see its README.md before the first drive)
mode: teleop

# Laptop testing only; keep false on the robot. true (mode: autonomy only) replaces the sensors and
# the drive chain with delivery-autonomy's Gazebo sim, so it needs Gazebo: run startup.sh inside
# delivery-autonomy's `nix develop` with ROS_SETUP= (deployment/README.md, "Testing with the sim").
sim: false

# DDS domain for every node started at boot (0-101). Leave commented to keep the default
# (domain 0, shared with every other ROS 2 machine on the same network).
# ros_domain_id: 42

# Identity shown on the robo-web dashboard (../robo-web, deployed on Vercel).
robot_id: robo-1

# Base URL of the robo-web deployment. startup.sh and the heartbeat node
# POST to <api_url>/api/heartbeat.
api_url: https://robo-web-ebon.vercel.app
