# Robot startup config, read by deployment/startup.sh on every boot.
# Committed defaults. To override on one Pi without touching git, copy this
# file to deployment/robot_config.local.yaml (gitignored) and edit that.

# Which stack master_launch.py brings up:
#   teleop     - wired joystick teleop (joy_node + joystick_control)
#   autonomous - sensor stack (RTK GPS + NTRIP, IMU)
# Both modes also run the robot model TF and the RPLidar C1 (/scan,
# /scan_filtered) whenever the lidar is plugged in.
mode: teleop

# Identity shown on the robo-web dashboard (../robo-web, deployed on Vercel).
robot_id: robo-1

# Base URL of the robo-web deployment. startup.sh and the heartbeat node
# POST to <api_url>/api/heartbeat.
api_url: https://robo-web-ebon.vercel.app
