# Robot startup config, read by deployment/startup.sh on every boot.
# Committed defaults. To override on one Pi without touching git, copy this
# file to deployment/robot_config.local.yaml (gitignored) and edit that.

# Which stack master_launch.py brings up:
#   teleop     - wired joystick teleop (joy_node + joystick_control)
#   autonomous - sensor stack (RTK GPS + NTRIP, IMU); nothing drives the motors
#   autonomy   - the full delivery-autonomy stack on the robot: sensors + arduino_bridge +
#                twist_mux + joystick override + EKF/planner/MPPI controller
#                (ros2_ws/src/hardware_bringup, see its README.md before the first drive)
# Every mode also runs the robot model TF and the RPLidar C1 (/scan, /scan_filtered)
# whenever the lidar is plugged in (not with sim: true, where Gazebo provides both).
mode: teleop

# Laptop testing only; keep false on the robot. true (mode: autonomy only) replaces the sensors and
# the drive chain with delivery-autonomy's Gazebo sim, so it needs Gazebo: run startup.sh inside
# delivery-autonomy's `nix develop` with ROS_SETUP= (deployment/README.md, "Testing with the sim").
sim: false

# Nav2 local planning (mode: autonomy only): boundary-map costmap + planner_server + local_planner,
# goals on /goal_pose or /nav/goal_node. Needs the apt Nav2 packages (deployment/install_deps.sh).
nav2: false

# RPLidar C1 driver (/scan, /scan_filtered) + hot-plug watchdog, every mode except sim. false =
# skip it (e.g. no lidar plugged in, or mode: autonomy without nav2/obstacle_guard needing it).
# autonomy mode: obstacle_guard still locks driving if neither this nor the depth camera
# publishes, so turn obstacle_guard off too if the RealSense is also off.
lidar: true

# Intel RealSense depth camera driver (/camera/color, /camera/depth), every mode except sim.
# false = skip it (e.g. no camera plugged in). autonomy mode: obstacle_guard still locks driving
# if neither this nor the lidar publishes, so turn obstacle_guard off too if the lidar is also off.
realsense: true

# mode: autonomy only (TDM-52): blocks autonomous driving (twist_mux lock) while neither the
# lidar nor the RealSense publishes; the joystick still overrides. false = disabled (never locks,
# logs an error every 30 s) for bench work without sensors, e.g. alongside lidar: false and
# realsense: false above.
obstacle_guard: true

# DDS domain for every node started at boot (0-101). Leave commented to keep the default
# (domain 0, shared with every other ROS 2 machine on the same network).
# ros_domain_id: 42

# Identity shown on the robo-web dashboard (../robo-web, deployed on Vercel).
robot_id: robo-1

# Base URL of the robo-web deployment. startup.sh and the heartbeat node
# POST to <api_url>/api/heartbeat.
api_url: https://robo-web-ebon.vercel.app
