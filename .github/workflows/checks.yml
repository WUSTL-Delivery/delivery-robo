# Runs on every push. static: shell scripts, YAML, package.xml and workflow files. ros: colcon
# build + test (Python lint included) in docker/Dockerfile's test stage, natively on amd64 and
# arm64; `docker build -f docker/Dockerfile --target test .` runs the same locally. Tools and
# third-party actions are pinned.
name: checks

on:
  push:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/r:ro" -w /r \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -S warning
      - name: yamllint
        run: |
          git ls-files -z '*.yaml' '*.yml' | xargs -0 pipx run yamllint==1.38.0 \
            -d '{extends: relaxed, rules: {line-length: disable}}'
      - name: package.xml
        run: |
          git ls-files -z 'ros2_ws/src/*package.xml' | xargs -0 python3 -c \
            'import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]'
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/r:ro" -w /r \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  ros:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Reads the image workflow's cache (scope = platform) for the dependency layers; writes its
      # own scope so the two workflows never overwrite each other's cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=gha,scope=test-${{ matrix.platform }}
          cache-to: type=gha,scope=test-${{ matrix.platform }},mode=max
